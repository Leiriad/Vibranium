plugins {
    id("java-library")
    id("dev.architectury.loom") version "${architectury_loom_version}" apply false
    id("architectury-plugin") version "${architectury_plugin_version}"
    id("com.gradleup.shadow") version "${shadow_version}" apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    // Modern way to apply plugins in subprojects instead of `apply plugin: "..."`
    plugins.apply("dev.architectury.loom")
    plugins.apply("architectury-plugin")
    plugins.apply("maven-publish")

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "${rootProject.archives_name}-${project.name}"
    }

    repositories {
        maven {
            name = "NeoForged"
            url = uri("https://maven.neoforged.net/releases")
        }
        maven {
            url = "https://api.modrinth.com/maven"
        }
        maven {
            name = "Shedaniel"
            url = uri("https://maven.shedaniel.me/")
        }

        exclusiveContent {
            forRepository {
                maven {
                    name = "Modrinth"
                    url = uri("https://api.modrinth.com/maven")
                }
            }
            filter {
                includeGroup("maven.modrinth")
            }
        }
        maven {
            // Location of the maven that hosts JEI files since January 2023
            name = "Jared's Maven"
            url = uri("https://maven.blamejared.com/")
        }
        maven {
            // Location of a maven mirror for JEI files, as a fallback
            name = "ModMaven"
            url = uri("https://modmaven.dev")
        }
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft("net.minecraft:minecraft:${rootProject.minecraft_version}")
        mappings(loom.officialMojangMappings())
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        withSourcesJar()

        // Recommended modern alternative to sourceCompatibility / targetCompatibility
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 21
    }

    // Configure Maven publishing.
    publishing {
        publications {
            register("mavenJava", MavenPublication) {
                artifactId = base.archivesName.get()
                from(components.getByName("java"))
            }
        }

        repositories {
            // Add repositories to publish to here.
        }
    }
}