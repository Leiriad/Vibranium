
plugins {
    id 'com.gradleup.shadow'
}

architectury {
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        url = "https://maven.terraformersmc.com/releases/"
    }
    maven {
        url = "https://maven.shedaniel.me/"
    }
    maven {
        url = "https://maven.blamejared.com"
    }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API
    implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Architectury API
    implementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    // Cloth Config
    api "me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}"
    include "me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}"

    // ModMenu API
    api("com.terraformersmc:modmenu:${rootProject.modmenu_version}")

    // TEAMREBORN ENERGY API
    include "teamreborn:energy:${rootProject.teamreborn_energy_version}"

    // REI
    compileOnlyApi "me.shedaniel:RoughlyEnoughItems-api-fabric:${rootProject.rei_version}"
    compileOnlyApi "me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:${rootProject.rei_version}"

    // JEI
    compileOnlyApi("mezz.jei:jei-${rootProject.minecraft_version}-fabric-api:${rootProject.jei_version}")

    common(project(path: ':common')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')


}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }
    from(project(":common").file("src/main/resources/vibranium.accesswidener"))
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

jar {
    inputs.file(shadowJar.archiveFile)
}
shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null
}
assemble.dependsOn shadowJar
loom {
    accessWidenerPath = project(":common").file("src/main/resources/vibranium.accesswidener")

    loom {
        accessWidenerPath = project(":common").file("src/main/resources/vibranium.accesswidener")

        runs {
            datagen {
                client()
                displayName = "Minecraft Data"
                runDirectory.set(file("build/datagen"))

                jvmArguments.addAll([
                        "-Dfabric-api.datagen",
                        "-Dfabric-api.datagen.output-dir=${project(":common").file("src/main/generated").absolutePath}",
                        "-Dfabric-api.datagen.modid=vibranium"
                ])
            }
        }
    }
}

configurations {
    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}