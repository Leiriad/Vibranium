plugins {
    id 'com.gradleup.shadow'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }

}

repositories {
    maven {
        name = "NeoForged"
        url = "https://maven.neoforged.net/releases"
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    // Architectury API
    implementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    //Cloth Config
    api "me.shedaniel.cloth:cloth-config-neoforge:${rootProject.cloth_config_version}"

    //REI
    compileOnlyApi  "me.shedaniel:RoughlyEnoughItems-neoforge:${rootProject.rei_version}"
    compileOnlyApi  "me.shedaniel:REIPluginCompatibilities-forge-annotations:12.+"

    //JEI
    compileOnly("mezz.jei:jei-${rootProject.minecraft_version}-neoforge-api:${rootProject.jei_version}")

    common(project(path: ':common', configuration: 'namedElements')) { transitive = true }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

jar {
    inputs.file(shadowJar.archiveFile)
}
shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null
}

assemble.dependsOn shadowJar

loom {
    accessWidenerPath = project(":common").file("src/main/resources/vibranium.accesswidener")
}
configurations {
    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}
